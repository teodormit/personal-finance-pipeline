# GitHub Actions CI workflow. Runs on every push and pull request.
#
# Two jobs:
#   test  - plain pytest. Integration tests that need a live Postgres
#           auto-skip here, so this is the fast unit-level signal.
#   check - scripts/check.py, the project grader: Tier 1 (unit, no DB)
#           plus Tier 2, which starts a throwaway postgres:17 container
#           via the runner's Docker and runs the pipeline invariants
#           against synthetic data. Never touches a real warehouse.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  check:
    name: Full check (Tier 1 + scratch Postgres)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check.py
        run: python scripts/check.py
